<p style="font-family:'LXGW WenKai TC', 'Noto Sans TC', sans-serif;font-size:32px;color:#C8372D">先問大家一個問題</p>
<h2 style="font-family:'LXGW WenKai TC', 'Noto Sans TC', sans-serif;font-size:120px;font-weight:700;color:#2B4C8C;line-height:1.15">這學期，誰熬過夜？</h2>
<div style="width:1180px;display:flex;flex-direction:column;gap:20px;border-left:8px solid #C8372D;padding:8px 0px 8px 40px">
<p style="font-family:'LXGW WenKai TC', 'Noto Sans TC', sans-serif;font-size:60px;line-height:1.3">「肝從不抱怨，直到某天直接離職。」</p>
<p style="font-size:32px;color:#4A4F57;line-height:1.5">這是我們遊戲裡的一句台詞，而且<span style="color:#C8372D">是真的</span>：<br>肝臟出問題初期，常常沒有任何症狀。</p>

<p style="position:absolute;left:176px;bottom:64px;width:1000px;font-size:24px;color:#5F646C">人體股份有限公司｜期末專題提案</p>
<p style="position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;color:#5F646C;text-align:right">02</p>
<aside>（約 25 秒）先問大家：這學期有熬過夜的請舉手。（停一下，指向右邊的小晨）我們的主角小晨也舉手了。我們的身體其實一直在替我們加班，只是它不太會抱怨。像肝，它從不抱怨，直到某天直接離職。這是我們遊戲裡的台詞，也是真的：肝臟出問題初期常常沒有症狀。我們想做的，就是讓大家在笑的同時記住這些事。</aside>
